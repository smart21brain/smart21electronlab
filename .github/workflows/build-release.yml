name: 2 - Build signed AAB for Google Play
# Needs the 3 secrets from workflow "1 - Create signing key": KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS
on:
  workflow_dispatch:
jobs:
  aab:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run pwa
      - run: npx cap add android
      - run: node scripts/android-splash.js     # black splash screen with the Smart21 logo
      - run: npx -y @capacitor/assets generate --android
        continue-on-error: true
      - run: npx cap sync android
      - name: Set version (Google Play needs a bigger versionCode every upload)
        working-directory: android
        run: |
          VN=$(node -p "require('../package.json').version")
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$VN\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle
      - name: Build AAB
        working-directory: android
        run: |
          sed -i '/networkTimeout/d' gradle/wrapper/gradle-wrapper.properties
          echo 'networkTimeout=180000' >> gradle/wrapper/gradle-wrapper.properties
          sed -i 's/-all\.zip/-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3 4; do
            ./gradlew bundleRelease && exit 0
            echo "Attempt $i failed, retrying in 30 seconds..."; sleep 30
          done
          exit 1
      - name: Sign AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Secrets are missing. Run workflow 1 first and add the 3 secrets."; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          cp android/app/build/outputs/bundle/release/app-release.aab Smart21-ElectroLab.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.jks \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" Smart21-ElectroLab.aab "$KEY_ALIAS"
          jarsigner -verify Smart21-ElectroLab.aab | head -3
          rm release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: Smart21-ElectroLab-aab
          path: Smart21-ElectroLab.aab
