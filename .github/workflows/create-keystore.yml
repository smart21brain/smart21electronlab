name: 1 - Create signing key (run once)
# Makes your private signing key for Google Play. Run it ONE time, download the result, then delete the artifact.
on:
  workflow_dispatch:
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Create keystore
        run: |
          PASS=$(openssl rand -hex 12)
          echo "::add-mask::$PASS"
          keytool -genkeypair -v -keystore smart21.jks -alias smart21 -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Smart21, O=Smart21, C=TZ"
          mkdir out
          cp smart21.jks out/
          base64 -w 0 smart21.jks > out/KEYSTORE_BASE64.txt
          {
            echo "Add these 3 secrets in GitHub (Settings > Secrets and variables > Actions):"
            echo "KEYSTORE_BASE64  = the full text inside KEYSTORE_BASE64.txt"
            echo "KEYSTORE_PASSWORD = $PASS"
            echo "KEY_ALIAS         = smart21"
            echo
            echo "KEEP smart21.jks and this password safe forever. If you lose them you cannot update your app on Google Play."
          } > out/READ-ME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: smart21-signing-key
          path: out/*
          retention-days: 1
