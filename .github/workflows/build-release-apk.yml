name: 3 - Build release APK (for phones that reject the debug APK)
# Builds a normal (non-debug) APK. Uses your key from the secrets if you made one, otherwise makes a temporary key.
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run pwa
      - run: npx cap add android
      - run: node scripts/android-splash.js     # black splash screen with the Smart21 logo
      - run: npx -y @capacitor/assets generate --android
        continue-on-error: true
      - run: npx cap sync android
      - name: Set version
        working-directory: android
        run: |
          VN=$(node -p "require('../package.json').version")
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$VN\"/" app/build.gradle
      - name: Build unsigned release APK
        working-directory: android
        run: |
          sed -i '/networkTimeout/d' gradle/wrapper/gradle-wrapper.properties
          echo 'networkTimeout=180000' >> gradle/wrapper/gradle-wrapper.properties
          sed -i 's/-all\.zip/-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3 4; do
            ./gradlew assembleRelease && exit 0
            echo "Attempt $i failed, retrying in 30 seconds..."; sleep 30
          done
          exit 1
      - name: Align and sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"
          else
            echo "No secrets found: making a temporary key."
            PASS=$(openssl rand -hex 12); ALIAS=temp
            keytool -genkeypair -keystore release.jks -alias temp -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Smart21, O=Smart21, C=TZ"
          fi
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out Smart21-ElectroLab-release.apk aligned.apk
          "$BT/apksigner" verify --verbose Smart21-ElectroLab-release.apk | head -5
          rm -f release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: Smart21-ElectroLab-release-apk
          path: Smart21-ElectroLab-release.apk
